<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan motions</title>
<style>
  :root { --canvas: #f4ead7; --panel: #fff4cf; --soft: #fff7df; --ink: #101010; --muted: #5d564a; --green: #a8eb37; --yellow: #ffcf31; --coral: #ff684f; --border: 2px solid #101010; --shadow: #101010; --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1); --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); background-color: var(--canvas); background-image: linear-gradient(to right, rgba(16,16,16,.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(16,16,16,.07) 1px, transparent 1px); background-size: 18px 18px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; display: grid; gap: 28px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.03em; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .picks button { font: 600 0.9rem/1 Inter, system-ui, sans-serif; padding: 10px 14px; border: var(--border); border-radius: 6px; background: var(--soft); color: var(--ink); box-shadow: 2px 2px 0 var(--shadow); cursor: pointer; }
  .picks button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--shadow); }
  .picks button.on { background: var(--green); }
  .note { max-width: 62ch; margin: 0; font-size: 1rem; line-height: 1.5; color: var(--muted); }
  .note b { color: var(--ink); }
  .stage { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px; min-height: 480px; }
  .ctl { display: flex; gap: 8px; align-items: center; }
  .ctl button { font: 600 0.85rem/1 var(--mono); padding: 9px 12px; border: var(--border); border-radius: 6px; background: var(--panel); box-shadow: 2px 2px 0 var(--shadow); cursor: pointer; }

  /* the fan, as on the site */
  .fan { position: relative; width: 520px; height: 430px; perspective: 1400px; }
  .fan.slot { clip-path: inset(-160px -600px -120px -240px); }
  .fcard { position: absolute; left: 40px; bottom: 36px; width: 270px; height: 330px; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 18px 18px 14px; border: var(--border); border-radius: 7px; box-shadow: 4px 4px 0 var(--shadow); color: #141410; cursor: pointer; transform-origin: 50% 120%;
    transform: rotate(var(--r, 0deg)) translate(calc(var(--x, 0px) + var(--dx, 0px)), calc(var(--y, 0px) + var(--lift, 0px))) rotateY(var(--fy, 0deg)) scale(var(--s, 1));
    transition: transform 560ms var(--ease-out); will-change: transform; backface-visibility: hidden; }
  .fcard.r0 { --r: 0deg; --x: 0px; --y: 0px; z-index: 4; }
  .fcard.r1 { --r: 9deg; --x: 34px; --y: 4px; z-index: 3; }
  .fcard.r2 { --r: 18deg; --x: 68px; --y: 14px; z-index: 2; }
  .fcard.r3 { --r: 27deg; --x: 102px; --y: 30px; z-index: 1; }
  .fcard.snap { transition: none !important; }
  .fcard.cream { background: var(--panel); } .fcard.yellow { background: var(--yellow); } .fcard.coral { background: var(--coral); } .fcard.green { background: var(--green); }
  .tag { display: flex; justify-content: space-between; align-items: center; font: 400 0.68rem/1.2 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.8; }
  .tag .p { opacity: 1; padding: 5px 10px; border: 2px solid currentColor; border-radius: 6px; font: 750 0.95rem/1 Inter, system-ui, sans-serif; text-transform: none; }
  .quote { align-self: center; margin: 0; font-size: 1.6rem; font-weight: 750; letter-spacing: -0.03em; line-height: 1.08; }
  .quote .w { display: inline-block; animation: develop 260ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 45ms); }
  @keyframes develop { from { opacity: 0; transform: translateY(5px); } }
  .foot { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; }
  .orb { width: 36px; height: 36px; display: grid; place-items: center; border: var(--border); border-radius: 50%; background: var(--soft); box-shadow: 3px 3px 0 var(--shadow); }
  .orb svg { width: 12px; }
  .wave { display: flex; align-items: center; gap: 2px; height: 30px; }
  .wave i { flex: 1; height: calc(var(--h) * 1%); background: currentColor; opacity: 0.45; border-radius: 1px; }

  /* B · lift over: straight up, clear of the hand, then down into the back */
  .fcard.up { --lift: -420px; transition: transform 340ms var(--ease-out); }
  .fcard.above { --lift: -420px; }
  /* C · slide out: off to the left, then in behind from the left */
  .fcard.out { --dx: -380px; --r: -6deg; transition: transform 340ms cubic-bezier(0.4, 0, 0.8, 1); }
  .fcard.aside { --dx: -340px; }
  /* D · flip through: edge-on at ninety degrees, where there is nothing to see */
  .fcard.edge { --fy: 90deg; transition: transform 260ms cubic-bezier(0.5, 0, 1, 1); }
  .fcard.edge-back { --fy: -90deg; }
  /* E · drop through the slot (the site today) */
  .fcard.drop { --lift: 580px; --r: -4deg; z-index: 5; transition: transform 360ms cubic-bezier(0.5, 0, 1, 1); }
  .fcard.below { --lift: 580px; }
  /* F · sink: the card shrinks and slides down under the others as they come over it */
  .fcard.sink { --s: 0.92; --lift: 40px; z-index: 0; transition: transform 560ms var(--ease-out); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fan motions</h1>
  <div class="picks" id="picks"></div>
  <p class="note" id="note"></p>
  <div class="stage">
    <div class="ctl"><button id="next">Next card</button><button id="auto">Pause</button></div>
    <div class="fan" id="fan">
      <div class="fcard cream" data-tone="Gentle" data-who="Derek" data-line="Come on back, you were doing well."></div>
      <div class="fcard yellow" data-tone="Mom" data-who="Elise" data-line="Close it, or you're grounded. Don't test me."></div>
      <div class="fcard coral" data-tone="Gen Z" data-who="Derek" data-line="Bro, lock in."></div>
      <div class="fcard green" data-tone="Stern" data-who="Elise" data-line="You're wasting your own time. Back to it."></div>
    </div>
  </div>
</div>
<script>
(function () {
  var fan = document.getElementById("fan"), cards = Array.prototype.slice.call(fan.querySelectorAll(".fcard")), order = [0, 1, 2, 3], timer = null, busy = false;
  cards.forEach(function (c, i) {
    var bars = ""; for (var k = 0; k < 40; k++) bars += '<i style="--h:' + (18 + Math.round(70 * Math.abs(Math.sin(k / 40 * Math.PI)) * (0.45 + 0.55 * ((k * 37 + i * 11) % 100) / 100))) + '"></i>';
    c.innerHTML = '<div class="tag"><span class="p">' + c.dataset.tone + '</span><span>' + c.dataset.who + '</span></div><p class="quote"></p><div class="foot"><span class="orb"><svg viewBox="0 0 12 12"><path d="M2.5 1v10L11 6z" fill="currentColor"/></svg></span><div class="wave">' + bars + '</div></div>';
    say(c);
    c.addEventListener("click", function () { if (busy || order[0] === i) return; while (order[0] !== i) order.push(order.shift()); layout(); say(cards[i]); restart(); });
  });
  function say(c) { c.querySelector(".quote").innerHTML = ("“" + c.dataset.line + "”").split(" ").map(function (w, i) { return '<span class="w" style="--i:' + i + '">' + w + "</span>"; }).join(" "); }
  function layout(skip) { order.forEach(function (idx, pos) { var c = cards[idx]; if (c === skip) return; c.classList.remove("r0", "r1", "r2", "r3"); c.classList.add("r" + pos); }); }
  function reflow(c) { void c.offsetWidth; }
  /* two-phase helper: leave with `go`, then snap to the back wearing `hold`, then release */
  function twoPhase(front, go, hold, ms) {
    busy = true;
    order.push(order.shift()); layout(front); front.classList.add(go); say(cards[order[0]]);
    setTimeout(function () {
      front.classList.add("snap", hold); front.classList.remove(go); layout(); reflow(front); front.classList.remove("snap", hold);
      setTimeout(function () { busy = false; }, 560);
    }, ms);
  }
  var MODES = {
    deal: { name: "A · Deal from the back", note: "<b>The click motion, run on a timer.</b> The back card slides forward to the front; the others step back one place. Nothing leaves the hand and nothing swaps layers in the open: the card that moves is on top from the start, and it was mostly covered when it started, so there is no pop to see.",
      step: function () { order.unshift(order.pop()); layout(); say(cards[order[0]]); } },
    lift: { name: "B · Lift over", note: "<b>Straight up, clear of the hand, then down into the back.</b> The front card rises until it is fully above the others, changes layer up there where nothing overlaps it, and comes down into the back slot while the others step forward.",
      step: function () { twoPhase(cards[order[0]], "up", "above", 340); } },
    slide: { name: "C · Slide out, slip in", note: "<b>Out to the left, in from the left, behind.</b> The front card slides clear of the hand to the left, then slides back in at the rear from the same side. It changes layer while it is off the hand, like a card being dealt and then tucked in.",
      step: function () { twoPhase(cards[order[0]], "out", "aside", 340); } },
    flip: { name: "D · Flip through", note: "<b>Edge-on at ninety degrees.</b> The front card turns on its vertical axis until it is a line, changes layer at that instant (there is nothing to see), and keeps turning into the back slot. The shortest of the five, and the layer swap is genuinely invisible.",
      step: function () { twoPhase(cards[order[0]], "edge", "edge-back", 260); } },
    drop: { name: "E · Drop through the slot (the site now)", note: "<b>Down through a slot at the base of the hand, then up behind.</b> The current motion, for comparison. The layer swap happens below the slot, but the card is still large and close when it goes, which is the half-second you dislike.",
      step: function () { twoPhase(cards[order[0]], "drop", "below", 360); } },
    sink: { name: "F · Sink under (the pop, on purpose)", note: "<b>Shrinks and slides down as the others come over it.</b> The Apple Wallet way. Included to show the thing to avoid: the card goes to the back layer at the first frame, so the others' edges appear across it at once.",
      step: function () { var f = cards[order[0]]; busy = true; order.push(order.shift()); layout(f); f.classList.add("sink"); say(cards[order[0]]); setTimeout(function () { f.classList.add("snap"); f.classList.remove("sink"); layout(); reflow(f); f.classList.remove("snap"); busy = false; }, 560); } }
  };
  var mode = location.hash.slice(1) in MODES ? location.hash.slice(1) : "deal", picks = document.getElementById("picks");
  Object.keys(MODES).forEach(function (k) { var b = document.createElement("button"); b.textContent = MODES[k].name; b.dataset.k = k; b.addEventListener("click", function () { pick(k); }); picks.appendChild(b); });
  function pick(k) { mode = k; fan.classList.toggle("slot", k === "drop"); picks.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.k === k); }); document.getElementById("note").innerHTML = MODES[k].note; restart(); }
  function step() { if (!busy) MODES[mode].step(); }
  var running = true;
  function restart() { clearInterval(timer); if (running) timer = setInterval(step, 3000); }
  document.getElementById("next").addEventListener("click", function () { step(); restart(); });
  document.getElementById("auto").addEventListener("click", function (e) { running = !running; e.target.textContent = running ? "Pause" : "Play"; restart(); });
  layout(); pick(mode);
})();
</script>
</body>
</html>
