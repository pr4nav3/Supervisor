# The website at supervisorfocus.com: website/ is uploaded as-is to GitHub Pages on every
# push to main that touches it. No build step; the site is plain HTML, CSS and JS.
name: pages

on:
  push:
    branches: [main]
    paths: [website/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the stylesheet and script links carry the commit, so a browser never shows a stale copy of either
      - run: sed -i "s/\(styles\.css\|site\.js\)\(?v=[^\"]*\)\?/?v=${GITHUB_SHA::7}/g" website/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
