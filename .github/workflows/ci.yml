# Every push is checked on both ship targets, so a change made on Windows cannot quietly
# break the Mac (or the other way round). Tests and the UI check on both; the Mac job also
# bundles a debug Supervisor.app, since bundling is where Mac-only config bites.
# The Python workers are not built here (their models are not in git); their model-free tests run.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: cargo test
        working-directory: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webcam_worker/requirements.txt
      - run: pip install -r webcam_worker/requirements.txt
      - run: python -m unittest discover -s webcam_worker && python -m unittest scripts/test_build_voice_runtime_manifest.py
      - name: Bundle the debug app (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --debug --bundles app --config '{"bundle":{"active":true,"targets":["app"]}}'
      - name: Lay out every screen in WebKit (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/mac-ui-check/check.sh
