# Every push is checked on both ship targets, so a change made on Windows cannot quietly
# break the Mac (or the other way round). Tests and the UI check on both; the Mac job also
# bundles a debug Supervisor.app, since bundling is where Mac-only config bites.
# The Python workers are not built here (their models are not in git); their model-free tests run.
name: ci

on:
  push:
  pull_request:

# The checkout token can read the repository and nothing else.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: cargo test
        working-directory: src-tauri
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webcam_worker/requirements.txt
      - run: pip install -r webcam_worker/requirements.txt
      - run: python -m unittest discover -s webcam_worker && python -m unittest scripts/test_build_voice_runtime_manifest.py
      - name: Bundle the debug app (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --debug --bundles app --config '{"bundle":{"active":true,"targets":["app"]}}'
      - name: Lay out every screen in WebKit (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/mac-ui-check/check.sh
