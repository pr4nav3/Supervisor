# Dependabot opens a pull request when a dependency has a new version; CI checks it on both
# ship targets. Actions are pinned by commit, so their updates come through here too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /webcam_worker
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /voice_worker
    schedule:
      interval: weekly
